server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-file paths serve index.html so Angular routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets (Angular appends content hash to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for index.html itself — must always reflect latest deployment
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
