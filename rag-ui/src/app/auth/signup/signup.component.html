<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">RAGStudio</span>
    </div>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Get started with your document workspace</p>

    <form (ngSubmit)="signup()">
      <div class="form-field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          minlength="3"
          maxlength="50"
          autocomplete="username"
          [disabled]="busy()"
          placeholder="Letters, numbers, _ or - (3–50 chars)"
        />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="6"
          autocomplete="new-password"
          [disabled]="busy()"
          placeholder="Choose a password (min 6 chars)"
        />
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          autocomplete="new-password"
          [disabled]="busy()"
          placeholder="Re-enter your password"
        />
      </div>

      @if (error(); as errorMessage) {
        <div class="error-banner" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="busy() || !username || !password || !confirmPassword">
        @if (busy()) { Creating account… } @else { Create Account }
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <button type="button" class="link-btn" (click)="goToLogin()">Sign in</button>
    </div>

  </div>
</div>
