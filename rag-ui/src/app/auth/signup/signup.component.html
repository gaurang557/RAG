<div class="auth-container">
  <div class="auth-card">
    <h1>Sign Up</h1>
    <p class="muted">Create a new account to access the RAG workspace</p>

    <form (ngSubmit)="signup()" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          minlength="3"
          maxlength="50"
          [disabled]="busy()"
          placeholder="Choose a username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="6"
          maxlength="100"
          [disabled]="busy()"
          placeholder="Choose a password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          [disabled]="busy()"
          placeholder="Confirm your password"
        />
      </div>

      @if (error(); as errorMessage) {
        <div class="error-message" aria-live="assertive">
          {{ errorMessage }}
        </div>
      }

      <div class="form-actions">
        <button type="submit" class="btn primary" [disabled]="busy() || !username || !password || !confirmPassword">
          @if (busy()) {
            Creating account...
          } @else {
            Sign Up
          }
        </button>
      </div>
    </form>

    <div class="auth-footer">
      <p class="muted">
        Already have an account? 
        <button type="button" class="link-button" (click)="goToLogin()">Login</button>
      </p>
    </div>
  </div>
</div>
