services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass a different model name at build time if you changed EMBED_MODEL in .env
      args:
        EMBED_MODEL: ${EMBED_MODEL:-all-MiniLM-L6-v2}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to your Neon connection string}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY must be set in .env}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY must be set in .env}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      EMBED_MODEL: ${EMBED_MODEL:-all-MiniLM-L6-v2}
      CORS_ALLOW_ORIGINS: http://localhost:3000
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-900}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-180}
      RAG_TOP_K: ${RAG_TOP_K:-12}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_QUERY_CACHE: ${MAX_QUERY_CACHE:-200}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  frontend:
    build:
      context: ./rag-web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked in at build time. Leave empty so the browser
      # auto-derives http://<hostname>:8000; set to a deployed API origin otherwise.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
